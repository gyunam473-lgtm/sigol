<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시골살이</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시골살이">
<meta name="theme-color" content="#cfe6ee">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <canvas id="c" aria-label="시골 마을 3D 화면. 누르면 그곳으로 걸어가요"></canvas>

  <!-- 화면 정보칸: 가운데(마을)를 가리지 않게 네 귀퉁이에 나눠 뒀어요 -->
  <div class="top">
    <div class="topbar">
      <div class="left"><span class="chip brand" id="brand">시골살이</span><span class="chip" id="money">500원</span></div>
      <div class="left"><button class="chip" id="nbBtn">이웃</button><button class="chip" id="plazaBtn">마을</button><button class="chip" id="dexBtn">도감 0/3</button></div>
    </div>
    <div class="cols">
      <!-- 왼쪽 위: 내 몸 상태 -->
      <div class="card stat" id="statCard">
        <button class="lvrow" id="lvBtn" title="눌러서 귀농 레벨 보기"><span class="lvname" id="lvName"></span><span class="xpbar"><i id="xpFill"></i></span></button>
        <span class="xpnum small" id="xpNum"></span><button class="more" id="statMore" aria-label="내 상태 더 보기" aria-expanded="false">▾</button>
        <div class="meter" title="일하면 줄고 먹으면 차요"><span class="mname">든든함</span><span class="xpbar"><i id="fullFill"></i></span><span class="xpnum" id="fullNum"></span></div>
        <div class="meter" title="일하면 줄고 우물에서 마시면 차요"><span class="mname">물</span><span class="xpbar"><i id="waterFill"></i></span><span class="xpnum" id="waterNum"></span></div>
        <p class="hint" id="hint">땅을 누르면 걸어가요.</p>
      </div>
      <!-- 오른쪽 위: 시간과 날씨 -->
      <div class="card side">
        <div class="clockrow"><button class="clock" id="clock" title="눌러서 날씨 미리보기"></button><button class="more" id="sideMore" aria-label="날씨와 단추 더 보기" aria-expanded="false">▾</button></div>
        <p class="hint" id="wxNote"></p>
        <p class="hint warn" id="wxWarn" hidden></p>
        <div class="sidebtns"><button class="snd" id="skyHud">하늘 보기</button><button class="snd" id="sndBtn">소리 켜기</button><button class="snd" id="resetBtn" title="시험 서버용: 기록을 지우고 처음부터">처음부터</button></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="fade" id="fade"></div>

  <div class="bottom">
    <!-- 오른쪽 아래: 창고, 돌아가기 -->
    <div class="br"><button class="chip big go" id="fishBtn" hidden>낚시하기</button><button class="chip big mapbtn" id="mapBtn" aria-label="마을 지도 열기"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>마을 지도</button><button class="chip big" id="invBtn">창고</button><button class="chip big go" id="homeBtn" hidden>우리 땅으로</button></div>
  </div>

  <!-- 작업 화면: 밭 한 칸을 가까이 보며 손동작으로 일해요 (js/play/work.js) -->
  <div class="work" id="work" hidden>
    <svg class="wlayer" id="wLayer"></svg>
    <div class="finger" id="wFinger"></div>
    <div class="wtop"><ol class="wsteps" id="wSteps"></ol><p class="wtip" id="wGuide"></p></div>
    <div class="wgauge" id="wGauge" hidden><i class="zone" id="wZone"></i><i class="fill" id="wFill"></i></div>
    <div class="wbot"><span class="wcare" id="wCare"></span><button id="wQuit">그만하기</button></div>
  </div>

  <!-- 앉은 화면: 평상·정자 소반 앞 (js/play/sit.js) -->
  <div class="sit" id="sit" hidden>
    <!-- 카메라 돌리기·크게·작게 (js/play/camctl.js) -->
    <div class="camctl" id="camctl" hidden><button id="camIn" aria-label="크게 보기">＋</button><button id="camOut" aria-label="작게 보기">－</button><button id="camReset">처음 시점</button></div>
    <div class="sitpanel" id="sitPanel"></div></div>

  <div class="loading" id="loading"><p class="lt">시골살이</p><p id="loadMsg">마을을 불러오는 중이에요…</p></div>

  <div class="modal" id="modal" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<!-- 문제가 생기면 불러오는 화면에 안내 문구를 띄워요 -->
<script>
function showFail(t){var l=document.getElementById("loading"),m=document.getElementById("loadMsg");if(l&&m){l.classList.remove("done");m.textContent=t}}
window.addEventListener("error",function(){showFail("화면을 그리다 문제가 생겼어요. 새로고침해 주세요.")});
</script>
<!-- 3D 도구 (three.js r128) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(typeof THREE==="undefined")showFail("3D 화면을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.");</script>
<!-- 게임 파일들: 순서가 중요해요. 위에 있는 파일을 아래 파일이 가져다 써요 -->
<!-- 기본: 게임 숫자, 저장 -->
<script src="js/core/data.js"></script>
<script src="js/core/state.js"></script>
<!-- 3D로 보이는 것 -->
<script src="js/world/scene.js"></script>
<script src="js/world/myland.js"></script>
<script src="js/world/ijang.js"></script>
<script src="js/world/barn.js"></script>
<script src="js/world/people.js"></script>
<script src="js/world/food.js"></script>
<script src="js/world/sea.js"></script>
<script src="js/world/meat.js"></script>
<script src="js/world/table.js"></script>
<script src="js/world/stove.js"></script>
<script src="js/world/yard.js"></script>
<script src="js/world/room.js"></script>
<script src="js/world/places.js"></script>
<script src="js/world/workshop.js"></script>
<script src="js/world/seats.js"></script>
<script src="js/world/places2.js"></script>
<script src="js/world/places3.js"></script>
<!-- 하는 일 -->
<script src="js/play/input.js"></script>
<script src="js/play/level.js"></script>
<script src="js/play/work.js"></script>
<script src="js/play/sit.js"></script>
<script src="js/play/eatanim.js"></script>
<script src="js/play/cook.js"></script>
<script src="js/play/together.js"></script>
<script src="js/play/meal.js"></script>
<script src="js/play/house.js"></script>
<script src="js/play/animals.js"></script>
<script src="js/play/camctl.js"></script>
<script src="js/play/farming.js"></script>
<script src="js/play/tend.js"></script>
<script src="js/play/neighbors.js"></script>
<script src="js/play/village.js"></script>
<script src="js/play/weather.js"></script>
<script src="js/play/storm.js"></script>
<script src="js/play/chore.js"></script>
<script src="js/play/fishing.js"></script>
<script src="js/play/forage.js"></script>
<script src="js/play/grind.js"></script>
<script src="js/play/stormfx.js"></script>
<script src="js/play/sound.js"></script>
<!-- 창 화면 -->
<script src="js/screens/hud.js"></script>
<script src="js/screens/market.js"></script>
<script src="js/screens/talk.js"></script>
<script src="js/screens/kitchen.js"></script>
<script src="js/screens/dex.js"></script>
<!-- 시작 (항상 마지막) -->
<script src="js/main.js"></script>
</body>
</html>
